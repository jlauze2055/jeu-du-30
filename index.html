<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeu du 30</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- ÉCRAN 1 : CONFIGURATION DES JOUEURS -->
  <section id="screen-config" class="screen">
    <h1>Bienvenue au jeu du 30</h1>
    <div class="inputs-container">
      <div class="input-group"><label>Joueur 1</label><input type="text" id="p1" placeholder="Obligatoire" required></div>
      <div class="input-group"><label>Joueur 2</label><input type="text" id="p2" placeholder="Obligatoire" required></div>
      <div class="input-group"><label>Joueur 3</label><input type="text" id="p3" placeholder="Facultatif"></div>
      <div class="input-group"><label>Joueur 4</label><input type="text" id="p4" placeholder="Facultatif"></div>
      <div class="input-group"><label>Joueur 5</label><input type="text" id="p5" placeholder="Facultatif"></div>
      <div class="input-group"><label>Joueur 6</label><input type="text" id="p6" placeholder="Facultatif"></div>
      <div class="input-group"><label>Joueur 7</label><input type="text" id="p7" placeholder="Facultatif"></div>
      <div class="input-group"><label>Joueur 8</label><input type="text" id="p8" placeholder="Facultatif"></div>
    </div>
    <button id="btn-start" class="btn-gray">Débuter la première manche</button>
  </section>

  <!-- ÉCRAN 2 : PLATEAU / TABLEAU DE POINTAGE -->
  <section id="screen-game" class="screen hidden">
    <div class="header-table">
      <h2>Tableau de pointage - Jeu du 30</h2>
      <div class="meta-row"><strong>Manche</strong> <span id="display-round-id">1</span></div>
      <div class="meta-row"><strong>Joueur</strong> <span id="display-current-player">...</span></div>
    </div>

    <!-- Zone d'action interactive intégrée au design -->
    <div id="action-panel">
      <!-- Lancer initial (6 dés) -->
      <div id="step-roll-6" class="meta-row-input">
        <label><strong>Total des lancers</strong></label>
        <input type="number" id="input-total-6" placeholder="Saisie entre 6 et 36" min="6" max="36">
        <button id="btn-submit-6" class="btn-small">OK</button>
      </div>

      <!-- Lancer de pénalité (Dés tirés) -->
      <div id="step-penalty" class="meta-row-input hidden">
        <label><strong id="label-penalty-text">Dés de pénalité</strong></label>
        <input type="number" id="input-dice-count" placeholder="Saisie entre 0 et 99" min="0" max="99">
        <button id="btn-submit-penalty" class="btn-small">OK</button>
      </div>
    </div>

    <!-- Grille dynamique des scores (3x3 circulaire, centre vide) -->
    <div id="scoreboard-grid" class="grid-container"></div>

    <!-- Zone de notifications, alertes d'éliminations ou de victoires -->
    <p id="system-message" class="red-italic-msg">Message d'élimination ou message au vainqueur</p>

    <!-- Boutons de contrôles inférieurs -->
    <div class="footer-buttons">
      <button id="btn-next-round" class="btn-gray hidden">Lancer la prochaine manche</button>
      <div class="spacer"></div>
      <button id="btn-undo" class="btn-gray">Annuler le dernier coup</button>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
